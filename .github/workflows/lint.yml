name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get install -y lua-check
      - name: Run luacheck
        run: luacheck lua/ plugin/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Run regression tests
        run: |
          for test_file in tests/*_spec.lua; do
            nvim --headless -u NONE "+set rtp+=." "+lua dofile('${test_file}')" +qa
          done
