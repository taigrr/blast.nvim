name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get install -y lua-check
      - name: Run luacheck
        run: luacheck lua/ plugin/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Run regression tests
        run: |
          shopt -s nullglob
          status=0
          for test_file in tests/*_spec.lua; do
            echo "Running ${test_file}"
            nvim --headless -u NONE "+set rtp+=." \
              "+lua local ok, err = pcall(dofile, '${test_file}'); if not ok then io.stderr:write(tostring(err) .. '\n'); vim.cmd('cq') end" \
              +qa || status=1
          done
          exit $status
